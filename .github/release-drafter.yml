branches:
  - main

name-template: 'Eden Online v$NEXT_PATCH_VERSION.xxxxxx'
tag-template: 'v$NEXT_PATCH_VERSION.xxxxxx'

categories:
  - title: '**ADDED:**'
    labels:
      - 'Feature'
  - title: '**FIXED:**'
    labels:
      - 'Bug Fix'
  - title: '**IMPROVED:**'
    labels:
      - 'Enhancement'
  - title: '**CHANGED:**'
    labels:
      - 'Cleanup'
  - title: '**TRANSLATIONS:**'
    labels:
      - 'Translation'

exclude-labels:
  - 'Ignore Changelog'

change-template: '- $TITLE (#$NUMBER) **$AUTHOR**'
template: |
  $CHANGES

  Change log for [Eden Online v$NEXT_PATCH_VERSION](https://github.com/ainoKarppi/EdenOnline/milestone/00?closed=1)

replacers:
  # Category titles
  - search: '/\#\# (\*\*(ADDED|FIXED|IMPROVED|CHANGED|TRANSLATIONS):\*\*)/g'
    replace: '$1'